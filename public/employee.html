<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Schedule & Job Status — Infinity Pools</title>
<style>
  :root {
    --blue:#0a5ea8; --blue-dark:#0b4d87; --blue-deep:#093d6b;
    --past:#9aa7b2; --future:#a8c4da; --pale:#e8f3fb; --soft:#d7e8f5;
    --ink:#16324a; --mid:#4a6b85; --green:#1f8a4c; --amber:#b97d10; --red:#c0392b;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(180deg,#eaf4fc 0%,#f6fafd 300px); color:var(--ink); }
  .wrap { max-width:1120px; margin:0 auto; padding:20px 22px 60px; }
  header { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff; border-radius:16px; padding:24px 30px; box-shadow:0 8px 30px rgba(10,94,168,.25); }
  header .brand { font-weight:800; letter-spacing:3px; font-size:17px; }
  header .brand .inf { font-size:24px; vertical-align:-3px; margin-right:6px; }
  header h1 { margin:9px 0 2px; font-size:24px; }
  header .sub { opacity:.85; font-size:14px; }
  .card { background:#fff; border:1px solid var(--soft); border-radius:16px; box-shadow:0 2px 14px rgba(10,94,168,.07); padding:22px; margin-top:18px; }
  h2 { margin:0 0 14px; color:var(--blue-deep); font-size:19px; }
  h3 { margin:0 0 8px; color:var(--blue-deep); font-size:15px; }
  .muted { color:var(--mid); font-size:13px; }
  .tabs { display:flex; gap:8px; margin-top:18px; }
  .tabs button { border:1.5px solid var(--soft); background:#fff; color:var(--blue-dark); border-radius:999px; padding:9px 20px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; }

  /* Schedule list */
  .day { margin-bottom:16px; }
  .day .dhead { font-weight:800; color:var(--blue-deep); font-size:14px; margin-bottom:6px; border-bottom:1px solid var(--soft); padding-bottom:4px; }
  .day .dhead.today { color:var(--blue); }
  .item { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid #f0f6fb; }
  .item:last-child { border-bottom:none; }
  .item .tm { font-size:12px; font-weight:700; color:var(--mid); min-width:64px; padding-top:2px; }
  .item .body { flex:1; min-width:0; }
  .item .ttl { font-weight:700; font-size:14px; }
  .item .meta { font-size:12px; color:var(--mid); margin-top:2px; }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:1px; }
  .pill.event { background:var(--pale); color:var(--blue-dark); }
  .pill.task { background:#fef2e0; color:var(--amber); }
  .pill.overdue { background:#fbe6e3; color:var(--red); }

  /* Calendar grid */
  .calbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .calbar button { border:1.5px solid var(--soft); background:#fff; color:var(--blue-dark); border-radius:8px; padding:6px 14px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .calbar .mo { font-weight:800; color:var(--blue-deep); font-size:16px; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .grid .dow { text-align:center; font-size:11px; font-weight:800; color:var(--mid); padding:4px 0; }
  .cell { min-height:78px; border:1px solid var(--soft); border-radius:8px; padding:4px 5px; background:#fff; overflow:hidden; }
  .cell.blank { background:transparent; border:none; }
  .cell.today { border-color:var(--blue); box-shadow:0 0 0 2px rgba(10,94,168,.15) inset; }
  .cell .dn { font-size:12px; font-weight:700; color:var(--mid); }
  .cell.today .dn { color:var(--blue); }
  .ev { font-size:10.5px; line-height:1.3; border-radius:4px; padding:1px 4px; margin-top:2px; background:var(--pale); color:var(--blue-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev.task { background:#fef2e0; color:var(--amber); }
  .ev.overdue { background:#fbe6e3; color:var(--red); }

  /* Projects list */
  .proj { border:1px solid var(--soft); border-radius:12px; padding:16px; margin-bottom:14px; cursor:pointer; transition:box-shadow .15s, border-color .15s, transform .05s; }
  .proj:hover { border-color:var(--future); box-shadow:0 4px 16px rgba(10,94,168,.12); }
  .proj:active { transform:scale(.997); }
  .proj .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .proj .addr { font-weight:800; font-size:16px; color:var(--blue-deep); }
  .proj .name { font-size:13px; color:var(--mid); margin-top:1px; }
  .proj .go { font-size:12px; color:var(--blue); font-weight:700; margin-top:8px; }
  .chip { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:999px; }
  .chip.active { background:#e2f3e9; color:var(--green); }
  .chip.completed { background:#eef1f4; color:var(--past); }
  .chip.contract_sent, .chip.prospect { background:var(--pale); color:var(--blue-dark); }
  .bar { height:9px; border-radius:999px; background:var(--soft); margin:12px 0 4px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--blue),var(--blue-dark)); }
  .phases { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .ph { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; border:1.5px solid var(--soft); color:var(--future); }
  .ph.complete { background:var(--past); border-color:var(--past); color:#fff; }
  .ph.active { background:var(--blue); border-color:var(--blue); color:#fff; }
  .contacts { font-size:12.5px; color:var(--mid); margin-top:10px; }
  .contacts b { color:var(--ink); }
  a.tel { color:var(--blue); text-decoration:none; font-weight:700; }
  .empty { text-align:center; color:var(--mid); padding:34px 10px; }

  /* Project detail */
  .back { display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--soft); background:#fff; color:var(--blue-dark); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:18px; }
  .back:hover { border-color:var(--future); }
  .chklist { display:flex; flex-direction:column; gap:8px; }
  .chk { display:flex; align-items:center; gap:10px; font-size:14px; }
  .chk .box { flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--future); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#fff; }
  .chk.done .box { background:var(--green); border-color:var(--green); }
  .chk .lbl { flex:1; font-weight:600; }
  .chk.done .lbl { color:var(--mid); }
  .chk .when { font-size:12px; color:var(--mid); white-space:nowrap; }
  .spectbl { width:100%; border-collapse:collapse; }
  .spectbl td { padding:9px 6px; border-bottom:1px solid #eef4f9; font-size:14px; }
  .spectbl td:first-child { color:var(--mid); font-weight:600; width:44%; }
  .spectbl td:last-child { font-weight:700; }
  .files { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .file { border:1px solid var(--soft); border-radius:10px; overflow:hidden; text-decoration:none; color:var(--ink); background:#fff; display:flex; flex-direction:column; transition:box-shadow .15s, border-color .15s; }
  .file:hover { border-color:var(--future); box-shadow:0 4px 14px rgba(10,94,168,.12); }
  .file .thumb { height:100px; background:var(--pale); display:flex; align-items:center; justify-content:center; font-size:34px; }
  .file .thumb img { width:100%; height:100%; object-fit:cover; }
  .file .fmeta { padding:9px 10px; }
  .file .fname { font-size:12.5px; font-weight:700; line-height:1.3; word-break:break-word; }
  .file .fcat { font-size:11px; color:var(--mid); margin-top:3px; }
  /* Photo gallery */
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .photo { aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:pointer; border:1px solid var(--soft); background:var(--pale); }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .15s; }
  .photo:hover img { transform:scale(1.05); }
  /* Lightbox */
  .lb { display:none; position:fixed; inset:0; background:rgba(9,32,48,.93); z-index:1000; align-items:center; justify-content:center; flex-direction:column; padding:20px; }
  .lb-img { max-width:92vw; max-height:80vh; object-fit:contain; border-radius:8px; box-shadow:0 10px 44px rgba(0,0,0,.55); }
  .lb-close { position:absolute; top:12px; right:16px; background:none; border:none; color:#fff; font-size:30px; line-height:1; cursor:pointer; }
  .lb-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); border:none; color:#fff; font-size:38px; width:52px; height:74px; border-radius:10px; cursor:pointer; }
  .lb-nav:hover { background:rgba(255,255,255,.25); }
  .lb-prev { left:14px; } .lb-next { right:14px; }
  .lb-bar { margin-top:14px; color:#fff; font-size:14px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .lb-dl { color:#bfe1f6; text-decoration:none; font-weight:700; }
  @media (max-width:640px) {
    .wrap { padding:12px 12px 44px; }
    .card { padding:16px; }
    header { padding:18px; }
    .cell { min-height:58px; }
    .item .tm { min-width:52px; }
    .files { grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); }
    .gallery { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
    .lb-nav { width:40px; height:60px; font-size:30px; }
    .lb-img { max-height:72vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="inf">∞</span><span id="brand">Infinity Pools</span></div>
    <h1>Team Schedule &amp; Job Status</h1>
    <div class="sub">Read-only crew view — updated live from the office. No financial or client-billing details.</div>
  </header>

  <div id="tabsRow" class="tabs">
    <button id="tabProjects" class="on" onclick="showTab('projects')">🏗 Projects</button>
    <button id="tabSchedule" onclick="showTab('schedule')">📅 Schedule</button>
  </div>

  <div id="content"><div class="card"><div class="empty">Loading…</div></div></div>
</div>

<div id="lightbox" class="lb" onclick="if(event.target.id==='lightbox')closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)" aria-label="Previous">‹</button>
  <img id="lbImg" class="lb-img" alt="">
  <button class="lb-nav lb-next" onclick="lbNav(1)" aria-label="Next">›</button>
  <div class="lb-bar"><span id="lbCap"></span> <a id="lbDownload" class="lb-dl" download>⬇ Download</a></div>
</div>

<script>
const TOKEN = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
let DATA = null;
let tab = 'projects';
let selectedId = null; // when set, show that project's overview
let calYM = null;      // {y, m} 0-based month for the calendar grid
let gallery = [];      // photos for the current project's lightbox
let lbIndex = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const STATUS = { prospect:'Prospect', contract_sent:'Contract Sent', active:'In Build', completed:'Completed' };

function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  if (!y) return s;
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM'; const h12 = ((h + 11) % 12) + 1;
  return h12 + (m ? ':' + pad(m) : '') + ' ' + ap;
}
function clientName(id) {
  const c = (DATA.clients || []).find(c => c.id === id);
  return c ? (c.address || c.name) : '';
}
function employeeName(id) {
  const e = (DATA.employees || []).find(e => e.id === id);
  return e ? e.name : '';
}
function statusWord(s) { return s === 'complete' ? 'Done' : s === 'active' ? 'In progress' : 'Not started'; }

// Merge events + open tasks into a single dated list of schedule items.
function scheduleItems(clientId) {
  const items = [];
  for (const e of (DATA.events || [])) {
    if (clientId && e.clientId !== clientId) continue;
    items.push({ kind:'event', date:e.date, endDate:e.endDate, time:e.time, title:e.title, details:e.details,
      clientId:e.clientId, employeeId:e.employeeId });
  }
  for (const t of (DATA.tasks || [])) {
    if (clientId && t.clientId !== clientId) continue;
    items.push({ kind:'task', date:t.dueDate, title:t.title, clientId:t.clientId });
  }
  return items;
}
function itemsOnDate(items, dateStr) {
  return items.filter(it => {
    if (!it.date) return false;
    if (it.endDate && it.endDate > it.date) return dateStr >= it.date && dateStr <= it.endDate;
    return it.date === dateStr;
  });
}

function showTab(t) {
  tab = t; selectedId = null;
  $('#tabProjects').className = t === 'projects' ? 'on' : '';
  $('#tabSchedule').className = t === 'schedule' ? 'on' : '';
  $('#tabsRow').style.display = '';
  window.scrollTo(0, 0);
  render();
}
function openProject(id) {
  selectedId = id;
  $('#tabsRow').style.display = 'none';
  window.scrollTo(0, 0);
  render();
}
function backToList() {
  selectedId = null;
  $('#tabsRow').style.display = '';
  render();
}

function render() {
  if (!DATA) return;
  closeLightbox();
  if (selectedId) { $('#content').innerHTML = renderDetail(); return; }
  $('#content').innerHTML = tab === 'schedule' ? renderSchedule() : renderProjects();
}

/* ---------------- Projects list ---------------- */
function renderProjects() {
  const clients = (DATA.clients || []).filter(c => c.status !== 'completed');
  const done = (DATA.clients || []).filter(c => c.status === 'completed');
  const order = { active:0, contract_sent:1, prospect:2, completed:3 };
  clients.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || String(a.address).localeCompare(String(b.address)));

  if (!clients.length && !done.length) return `<div class="card"><div class="empty">No active projects.</div></div>`;

  const card = c => {
    const cur = c.currentPhase;
    return `<div class="proj" onclick="openProject('${c.id}')">
      <div class="top">
        <div>
          <div class="addr">${esc(c.address || c.name || 'Project')}</div>
          ${c.name && c.address ? `<div class="name">${esc(c.name)}</div>` : ''}
        </div>
        <span class="chip ${c.status}">${STATUS[c.status] || c.status}</span>
      </div>
      ${cur ? `<div class="muted" style="margin-top:8px">Current phase: <b style="color:var(--ink)">${esc(cur.name)}</b>${cur.dueDate ? ' · due ' + fmtDate(cur.dueDate) : ''}</div>`
            : c.status === 'completed' ? `<div class="muted" style="margin-top:8px">🏁 Build complete</div>` : ''}
      <div class="bar"><div style="width:${c.progress || 0}%"></div></div>
      <div class="muted">${c.progress || 0}% complete${c.targetFinishDate ? ` · 🎯 target finish ${fmtDate(c.targetFinishDate)}` : ''}</div>
      <div class="go">View project →</div>
    </div>`;
  };

  return `<div class="card">
    <h2>Active Projects</h2>
    ${clients.length ? clients.map(card).join('') : '<div class="empty">No active projects right now.</div>'}
  </div>
  ${done.length ? `<div class="card"><h2>Completed</h2>${done.map(card).join('')}</div>` : ''}`;
}

/* ---------------- Project overview ---------------- */
function renderDetail() {
  const c = (DATA.clients || []).find(c => c.id === selectedId);
  if (!c) { backToList(); return ''; }
  const cur = c.currentPhase;
  const ct = c.contacts || {};
  const contactBits = [];
  if (ct.builder) contactBits.push(`<b>Builder:</b> ${esc(ct.builder)}`);
  if (ct.contractor) contactBits.push(`<b>Contractor:</b> ${esc(ct.contractor)}`);
  if (ct.other) contactBits.push(esc(ct.other));
  const extras = [];
  if (c.siteExcavation && c.siteExcavation.included) extras.push(`Site Excavation: ${statusWord(c.siteExcavation.status)}`);
  if (c.landscaping && c.landscaping.included) extras.push(`Landscaping: ${statusWord(c.landscaping.status)}`);

  // Per-project upcoming schedule (next 60 days + overdue tasks).
  const today = todayStr();
  const horizon = new Date(); horizon.setDate(horizon.getDate() + 60);
  const horizonStr = horizon.getFullYear() + '-' + pad(horizon.getMonth() + 1) + '-' + pad(horizon.getDate());
  const mine = scheduleItems(c.id)
    .filter(it => it.date && (it.date <= horizonStr) && (it.date >= today || (it.kind === 'task' && it.date < today)))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99').localeCompare(b.time || '99'));

  const specs = (c.equipmentPad ? [...(c.specs || []), ['Equipment pad', c.equipmentPad]] : (c.specs || []));
  const files = c.files || [];
  const photos = files.filter(f => f.isImage);
  const docs = files.filter(f => !f.isImage);
  // Populate the lightbox for this project's photos (index matches the grid order).
  gallery = photos.map(f => ({ url: fileUrl(c.id, f), name: f.name }));
  const checklist = c.checklist || [];

  return `
    <button class="back" onclick="backToList()">← All projects</button>

    <div class="card">
      <div class="top" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div>
          <div class="addr" style="font-size:22px;font-weight:800;color:var(--blue-deep)">${esc(c.address || c.name || 'Project')}</div>
          <div class="name" style="font-size:14px;color:var(--mid);margin-top:2px">
            ${c.name && c.address ? esc(c.name) : ''}${c.phone ? `${c.name && c.address ? ' · ' : ''}<a class="tel" href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : ''}
          </div>
        </div>
        <span class="chip ${c.status}">${STATUS[c.status] || c.status}</span>
      </div>
      ${cur ? `<div class="muted" style="margin-top:10px">Current phase: <b style="color:var(--ink)">${esc(cur.name)}</b>${cur.time ? ' · ' + esc(cur.time) : ''}${cur.dueDate ? ' · due ' + fmtDate(cur.dueDate) : ''}</div>`
            : c.status === 'completed' ? `<div class="muted" style="margin-top:10px">🏁 Build complete</div>` : ''}
      <div class="bar"><div style="width:${c.progress || 0}%"></div></div>
      <div class="muted">${c.progress || 0}% complete${c.targetFinishDate ? ` · 🎯 target finish ${fmtDate(c.targetFinishDate)}` : ''}</div>
      <div class="phases">
        ${(c.phases || []).map(p => `<span class="ph ${p.status}" title="${esc(p.name)}${p.dueDate ? ' — due ' + esc(fmtDate(p.dueDate)) : ''}">${esc(p.name)}</span>`).join('')}
      </div>
      ${extras.length ? `<div class="contacts">${extras.map(esc).join(' · ')}</div>` : ''}
      ${contactBits.length ? `<div class="contacts">${contactBits.join(' · ')}</div>` : ''}
    </div>

    ${checklist.length ? `<div class="card">
      <h2>✅ Checklist</h2>
      <div class="chklist">
        ${checklist.map(it => `<div class="chk ${it.done ? 'done' : ''}">
          <span class="box">${it.done ? '✓' : ''}</span>
          <span class="lbl">${esc(it.label)}</span>
          ${it.done && it.completedAt ? `<span class="when">${fmtDate(it.completedAt)}</span>` : ''}
        </div>`).join('')}
      </div>
    </div>` : ''}

    <div class="card">
      <h2>🏊 Pool Specs</h2>
      ${specs.length ? `<table class="spectbl"><tbody>${specs.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`
                     : `<div class="muted">No pool specs entered yet.</div>`}
    </div>

    ${photos.length ? `<div class="card">
      <h2>📸 Photos</h2>
      <div class="gallery">${photos.map((f, i) => `<div class="photo" onclick="openLightbox(${i})"><img src="${fileUrl(c.id, f)}" alt="${esc(f.name)}" loading="lazy"></div>`).join('')}</div>
    </div>` : ''}

    ${docs.length ? `<div class="card">
      <h2>📎 Documents</h2>
      <div class="files">${docs.map(f => fileCard(c.id, f)).join('')}</div>
    </div>` : ''}

    ${!files.length ? `<div class="card">
      <h2>📎 Files</h2>
      <div class="muted">No plans, renderings, or photos uploaded yet.</div>
    </div>` : ''}

    <div class="card">
      <h2>📅 Upcoming for this project</h2>
      ${mine.length ? mine.map(it => itemRow(it, today)).join('') : `<div class="muted">Nothing scheduled in the next 60 days.</div>`}
    </div>`;
}

function fileUrl(clientId, f) {
  return '/api/employee/' + encodeURIComponent(TOKEN) + '/files/' + encodeURIComponent(clientId) + '/' + encodeURIComponent(f.id);
}
function fileCard(clientId, f) {
  const url = fileUrl(clientId, f);
  const icon = /\.pdf$/i.test(f.name) ? '📄' : '📁';
  return `<a class="file" href="${url}" target="_blank" rel="noopener">
    <div class="thumb">${icon}</div>
    <div class="fmeta">
      <div class="fname">${esc(f.name)}</div>
      <div class="fcat">${esc(f.category)}</div>
    </div>
  </a>`;
}

/* ---------------- Photo lightbox ---------------- */
function openLightbox(i) {
  if (!gallery.length) return;
  lbIndex = i; renderLb();
  document.getElementById('lightbox').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}
function lbNav(delta) {
  if (!gallery.length) return;
  lbIndex = (lbIndex + delta + gallery.length) % gallery.length;
  renderLb();
}
function renderLb() {
  const g = gallery[lbIndex]; if (!g) return;
  document.getElementById('lbImg').src = g.url;
  document.getElementById('lbImg').alt = g.name;
  document.getElementById('lbCap').textContent = g.name + '  (' + (lbIndex + 1) + ' / ' + gallery.length + ')';
  const dl = document.getElementById('lbDownload'); dl.href = g.url; dl.setAttribute('download', g.name);
  document.querySelector('.lb-prev').style.display = gallery.length > 1 ? '' : 'none';
  document.querySelector('.lb-next').style.display = gallery.length > 1 ? '' : 'none';
}
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display !== 'flex') return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lbNav(-1);
  else if (e.key === 'ArrowRight') lbNav(1);
});

/* ---------------- Schedule tab ---------------- */
function renderSchedule() {
  const items = scheduleItems();
  const today = todayStr();

  const horizon = new Date(); horizon.setDate(horizon.getDate() + 60);
  const horizonStr = horizon.getFullYear() + '-' + pad(horizon.getMonth() + 1) + '-' + pad(horizon.getDate());
  const overdue = items.filter(it => it.kind === 'task' && it.date < today)
    .sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = items.filter(it => it.date >= today && it.date <= horizonStr);

  const byDate = {};
  for (const it of upcoming) (byDate[it.date] = byDate[it.date] || []).push(it);
  const dates = Object.keys(byDate).sort();

  let listHtml = '';
  if (overdue.length) {
    listHtml += `<div class="day"><div class="dhead" style="color:var(--red)">⚠ Overdue</div>` +
      overdue.map(it => itemRow(it, today)).join('') + `</div>`;
  }
  if (!dates.length && !overdue.length) {
    listHtml = `<div class="empty">Nothing scheduled in the next 60 days.</div>`;
  } else {
    for (const d of dates) {
      const its = byDate[d].sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
      listHtml += `<div class="day"><div class="dhead ${d === today ? 'today' : ''}">${fmtDate(d)}${d === today ? ' · Today' : ''}</div>` +
        its.map(it => itemRow(it, today)).join('') + `</div>`;
    }
  }

  return `
    <div class="card">
      <h2>Calendar</h2>
      ${renderCalendar(items, today)}
    </div>
    <div class="card">
      <h2>Upcoming</h2>
      ${listHtml}
    </div>`;
}

function itemRow(it, today) {
  const overdue = it.kind === 'task' && it.date < today;
  const pillClass = overdue ? 'overdue' : it.kind;
  const pillText = overdue ? 'Overdue' : (it.kind === 'task' ? 'Task' : 'Event');
  const proj = it.clientId ? clientName(it.clientId) : '';
  const who = it.employeeId ? employeeName(it.employeeId) : '';
  const metaBits = [];
  if (proj && !selectedId) metaBits.push('📍 ' + esc(proj));
  if (who) metaBits.push('👤 ' + esc(who));
  if (it.kind === 'task') metaBits.push('due ' + fmtDate(it.date));
  if (it.details) metaBits.push(esc(it.details));
  return `<div class="item">
    <div class="tm">${it.kind === 'event' && it.time ? esc(fmtTime(it.time)) : (it.kind === 'task' ? '📋' : 'All day')}</div>
    <div class="body">
      <div class="ttl">${esc(it.title)}<span class="pill ${pillClass}">${pillText}</span></div>
      ${metaBits.length ? `<div class="meta">${metaBits.join(' · ')}</div>` : ''}
    </div>
  </div>`;
}

function renderCalendar(items, today) {
  if (!calYM) { const d = new Date(); calYM = { y:d.getFullYear(), m:d.getMonth() }; }
  const { y, m } = calYM;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="cell blank"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + '-' + pad(m + 1) + '-' + pad(d);
    const its = itemsOnDate(items, ds).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    const evs = its.slice(0, 3).map(it => {
      const overdue = it.kind === 'task' && it.date < today;
      const cls = overdue ? 'overdue' : (it.kind === 'task' ? 'task' : '');
      const t = it.kind === 'event' && it.time ? fmtTime(it.time) + ' ' : '';
      return `<div class="ev ${cls}" title="${esc(it.title)}">${esc(t + it.title)}</div>`;
    }).join('');
    const more = its.length > 3 ? `<div class="ev" style="background:none;color:var(--mid)">+${its.length - 3} more</div>` : '';
    cells += `<div class="cell ${ds === today ? 'today' : ''}"><div class="dn">${d}</div>${evs}${more}</div>`;
  }

  return `
    <div class="calbar">
      <button onclick="calMove(-1)">‹ Prev</button>
      <span class="mo">${MONTHS[m]} ${y}</span>
      <button onclick="calMove(1)">Next ›</button>
    </div>
    <div class="grid">
      ${DOW.map(d => `<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>`;
}
function calMove(delta) {
  let { y, m } = calYM; m += delta;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  calYM = { y, m };
  render();
}

async function load() {
  try {
    const r = await fetch('/api/employee/' + encodeURIComponent(TOKEN));
    if (!r.ok) throw new Error('not found');
    DATA = await r.json();
    if (DATA.companyName) { $('#brand').textContent = DATA.companyName; document.title = 'Team Schedule & Job Status — ' + DATA.companyName; }
    render();
  } catch (e) {
    $('#tabsRow').style.display = 'none';
    $('#content').innerHTML = `<div class="card"><div class="empty">This link isn’t valid. Ask the office for an up-to-date Employee View link.</div></div>`;
  }
}
load();
</script>
